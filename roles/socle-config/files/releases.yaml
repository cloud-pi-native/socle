kind: DsoSocleConfig
apiVersion: cloud-pi-native.fr/v1alpha
metadata:
  name: conf-dso
spec:
  argocd:
    # https://artifacthub.io/packages/helm/argo/argo-cd
    chartVersion: 8.5.6
    # https://github.com/cloud-pi-native/helm-charts/tree/main/charts/dso-argocd-zone
    zoneChartVersion: "1.0.6"
  argocdInfra:
    # https://artifacthub.io/packages/helm/argo/argo-cd
    chartVersion: 8.5.6
    vaultPluginVersion: 1.18.1
  awx:
    # https://artifacthub.io/packages/helm/awx-operator-helm/awx-operator
    chartVersion: 3.2.1
    defaultAwxVersion: 24.6.1
  certmanager:
    # https://github.com/cert-manager/cert-manager/releases
    chartVersion: v1.14.3
  cloudnativepg:
    cluster:
      # https://artifacthub.io/packages/helm/cloudnative-pg/cluster
      chartVersion: 0.3.1
    operator:
      # https://artifacthub.io/packages/helm/cloudnative-pg/cloudnative-pg
      chartVersion: "0.27.0"
  console:
    # https://github.com/cloud-pi-native/console/releases
    chartVersion: 2.4.38
  cpnAnsibleJob:
    # https://github.com/cloud-pi-native/helm-charts/releases
    chartVersion: "1.1.0"
  gitlab:
    # https://artifacthub.io/packages/helm/gitlab/gitlab
    chartVersion: "9.4.1"
  glexporter:
    # https://github.com/mvisonneau/helm-charts/tree/main/charts/gitlab-ci-pipelines-exporter
    chartVersion: "0.3.5"
  gitlabOperator:
    # https://gitlab.com/gitlab-org/cloud-native/gitlab-operator/-/tags
    chartVersion: "2.4.1"
  gitlabrunner:
    # https://gitlab.com/gitlab-org/charts/gitlab-runner/-/tags
    chartVersion: "0.81.0"
  global:
    backup:
      vault:
        chartVersion: "1.0.0"
      vaultInfra:
        chartVersion: "1.0.0"
      dsoBackup:
        chartVersion: "1.0.5"
  grafana:
    # https://github.com/grafana/grafana/tags
    imageVersion: "10.4.3"
    # https://github.com/cloud-pi-native/helm-charts/tags
    chartVersion: "1.8.1"
  harbor:
    # https://artifacthub.io/packages/helm/harbor/harbor
    chartVersion: 1.17.1
  keycloak:
    # https://artifacthub.io/packages/helm/bitnami/keycloak
    chartVersion: 24.4.11
  keycloakx:
    # https://codecentric.github.io/helm-charts (keycloakx)
    chartVersion: "7.2.3"
    # Intermediate stepping-stone version, not the final target (26.7.2).
    # Direct 26.1.x -> 26.7.x fails on a known upstream bug: LazyInitialization
    # Exception in MigrateTo26_7_0.addOrganizationAdminRoles.
    # See https://github.com/keycloak/keycloak/issues/51304
    # Land on 26.6.4 successfully first, THEN bump straight to 26.7.2.
    imageVersion: "26.6.4"
  keycloakInfra:
    # https://artifacthub.io/packages/helm/bitnami/keycloak
    chartVersion: 24.4.11
  kyverno:
    # https://artifacthub.io/packages/helm/kyverno/kyverno
    chartVersion: 3.1.4
  nexus:
    # https://hub.docker.com/r/sonatype/nexus3/
    chartVersion: 5.23.1
  observatorium:
    # https://github.com/cloud-pi-native/helm-charts/tags
    chartVersion: "0.5.4"
    # https://github.com/cloud-pi-native/helm-charts/tags
    observabilityChartVersion: "0.1.8"
    # https://github.com/cloud-pi-native/helm-charts/tags
    observabilityPluginVersion: "v1.2.1"
  sonarqube:
    # https://artifacthub.io/packages/helm/sonarqube/sonarqube
    chartVersion: 10.8.1
  vault:
    # https://artifacthub.io/packages/helm/hashicorp/vault
    chartVersion: 0.30.0
  vaultInfra:
    # https://artifacthub.io/packages/helm/hashicorp/vault
    chartVersion: 0.29.1

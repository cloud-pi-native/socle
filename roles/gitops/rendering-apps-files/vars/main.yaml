values:
  argocd:
    configs: |
      rbac:
        scopes: "[groups]"
        policy.default: role:nada
        admin.enabled: "false"
        policy.csv: |
          p, role:admin, *, *, */*, allow
          p, role:nada, applicationsets, *, */*, deny
          p, role:nada, applications, *, */*, deny
          p, role:nada, logs, get, */*, allow
          p, role:nada, exec, *, */*, deny
          p, role:nada, certificates, *, *, deny
          p, role:nada, accounts, *, *, deny
          p, role:nada, gpgkeys, *, *, deny
          p, role:nada, projects, *, *, deny
          p, role:nada, clusters, *, *, deny
          p, role:nada, repositories, get, *, allow
          g, system:cluster-admins, role:admin
          g, cluster-admins, role:admin
          g, /admin, role:admin
          g, admin, role:admin

    cm: |
      resource.exclusions: |
        - apiGroups:
          - tekton.dev
          clusters:
          - '*'
          kinds:
          - TaskRun
          - PipelineRun
        - apiGroups:
          - wgpolicyk8s.io
          - aquasecurity.github.io
          clusters:
          - '*'
          kinds:
          - '*'
        - apiGroups:
          - postgresql.cnpg.io
          clusters:
          - '*'
          kinds:
          - Backup
        - apiGroups:
          - reports.kyverno.io
          clusters:
          - '*'
          kinds:
          - EphemeralReport
        - apiGroups:
          - reports.kyverno.io/v1
          clusters:
          - '*'
          kinds:
          - EphemeralReport
      resource.customizations.health.grafana.integreatly.org_GrafanaDashboard: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          hs.status = "Healthy"
          hs.message = "Assumed healthy"
        end
        return hs
      # We need this to be last so rootCA_block will be a sublevel of oidc.config
      oidc.config: |
        issuer: https://<path:{{ vaultinfra_kv_name }}/data/env/{{ dsc_name }}/apps/global/values#domain | jsonPath {.keycloakx}>/realms/{{ dsc.keycloakx.applicationRealm }}
        requestedScopes: ["openid", "generic"]
        name: Keycloak
        clientID: <path:{{ vaultinfra_kv_name }}/data/env/{{ dsc_name }}/apps/keycloakx/values#client | jsonPath {.argo.id}>
        clientSecret: <path:{{ vaultinfra_kv_name }}/data/env/{{ dsc_name }}/apps/keycloakx/values#client | jsonPath {.argo.secret}>

    rootCA_block: |
      rootCA: |
        <path:{{ vaultinfra_kv_name }}/data/env/{{ dsc_name }}/apps/global/values#exposedCa | indent 2>

    controller_metrics: |
      metrics:
        enabled: {{ dsc.global.metrics.enabled | lower }}
        serviceMonitor:
          enabled: {{ dsc.global.metrics.enabled | lower }}

    controller_metrics_labels: |
      labels: {{ dsc.global.metrics.additionalLabels | default('') }}

  vault:
    raft_standalone_config: |
      config: |
        ui = true
        disable_mlock = true
        service_registration "kubernetes" {}
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = "false"
          }
        }
        storage "raft" {
          path = "/vault/data"
        }
        telemetry {
          prometheus_retention_time = "12h"
          disable_hostname = true
        }

    serverTelemetry: |
      serverTelemetry:
        serviceMonitor:
          enabled: {{ (dsc.global.metrics.enabled or dsc.global.alerting.enabled) | lower }}
          authorization:
            credentials:
              name: {{ dsc_name }}-vault-keys
              key: root_token
          selectors: {{ dsc.global.metrics.additionalLabels | default ('{}', true) }}

# SonarQube Community Build deployed for each supported chart series (sonarqube.chartVersion >= 2025.6.0).
# The branch plugin (jar, -javaagent and webapp) must have exactly the same version as SonarQube,
# so the SonarQube version is pinned here (community.buildNumber) rather than left to the chart default.
# A chart series missing from this table makes the rendering fail (see tasks/preliminary.yml).
sonarqube_community_builds:
  "2025.6":
    buildNumber: "25.12.0.117093"
    branchPluginVersion: "25.12.0"
    oidcPluginVersion: "3.0.0"
    cnesReportVersion: "5.0.4"
  "2026.1":
    buildNumber: "26.1.0.118079"
    branchPluginVersion: "26.1.0"
    oidcPluginVersion: "3.0.0"
    cnesReportVersion: "5.0.4"
  # Chart 2026.5.x defaults to 26.9.0: pinned to 26.10.0 (latest version supported by the branch plugin).
  "2026.5":
    buildNumber: "26.10.0.133078"
    branchPluginVersion: "26.10.0"
    oidcPluginVersion: "3.0.0"
    cnesReportVersion: "5.0.5"

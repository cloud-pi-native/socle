---
- name: Reset Keycloak admin password
  hosts: localhost
  gather_facts: false
  vars:
    post_conf_job: true
    argo_infra_ns_check:
      failed: true  
  tasks:
    - name: "Déclaration du clone GitOps local"
      ansible.builtin.set_fact:
        gitops_local_repo: "{{ lookup('ansible.builtin.env', 'GITOPS_REPO_PATH') }}"
    - name: Set Keycloak password reset flag
      ansible.builtin.set_fact:
        keycloak_reset_password: true

    - name: Import socle-config role
      ansible.builtin.import_role:
        name: socle-config

    - name: Check socle_config_custom and exit if empty
      when: (dsc_cr is defined) and (socle_config_custom.resources | length == 0)
      block:
        - name: Warning message
          ansible.builtin.debug:
            msg:
              - "Attention ! Vous avez lancé le playbook avec l'option '-e dsc_cr={{ dsc_cr }}'"
              - "mais la ressource dsc nommée '{{ dsc_cr }}' est vide ou inexistante côté cluster !"
              - ""
              - "Vérifiez que vous ne vous êtes pas trompé de nom et que la ressource existe bien, via la commande suivante :"
              - ""
              - " kubectl get dsc {{ dsc_cr }} "
              - ""
              - "Si elle n'est pas trouvée (not found), listez simplement les ressources dsc actuellement déclarées :"
              - ""
              - " kubectl get dsc "
              - ""
              - "Puis relancez le playbook avec une ressource dsc existante."
              - ""
              - "Rappel : le présent playbook lancé seul, sans extra vars, utilisera la configuration dsc par défaut (conf-dso)."
              - "Il réinitialisera donc le mot de passe de l'administrateur Keycloak du namespace associé."

    - name: Set tmp_adm_pass fact
      ansible.builtin.set_fact:
        tmp_adm_pass: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"

    - name: Set kc_adm_pass fact
      ansible.builtin.set_fact:
        kc_adm_pass: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"

    - name: Bootstrap temporary admin via isolated pod
      block:
        - name: Get keycloak StatefulSet spec
          kubernetes.core.k8s_info:
            namespace: "{{ dsc.keycloakx.namespace }}"
            kind: StatefulSet
            name: keycloak
          register: kc_statefulset

        - name: Set kc_container_spec fact
          ansible.builtin.set_fact:
            kc_container_spec: "{{ kc_statefulset.resources[0].spec.template.spec.containers | selectattr('name', 'equalto', 'keycloak') | first }}"
            kc_pod_security_context: "{{ kc_statefulset.resources[0].spec.template.spec.securityContext | default({}) }}"
            kc_service_account: "{{ kc_statefulset.resources[0].spec.template.spec.serviceAccountName | default(omit) }}"

        - name: Set bootstrap pod name and temp admin username facts
          ansible.builtin.set_fact:
            bootstrap_pod_name: "keycloakx-bootstrap-admin-{{ now(fmt='%Y%m%d%H%M%S') }}"
            tmp_admin_username: "tmpadm-{{ now(fmt='%Y%m%d%H%M%S') }}"

        - name: Create isolated bootstrap-admin pod
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Pod
              metadata:
                name: "{{ bootstrap_pod_name }}"
                namespace: "{{ dsc.keycloakx.namespace }}"
                labels:
                  app.kubernetes.io/name: keycloakx-bootstrap-admin
              spec:
                restartPolicy: Never
                serviceAccountName: "{{ kc_service_account | default(omit) }}"
                securityContext: "{{ kc_pod_security_context }}"
                containers:
                  - name: bootstrap-admin
                    image: "{{ kc_container_spec.image }}"
                    securityContext: "{{ kc_container_spec.securityContext | default({}) }}"
                    command:
                      - /opt/keycloak/bin/kc.sh
                    args:
                      - bootstrap-admin
                      - user
                      - --username
                      - "{{ tmp_admin_username }}"
                      - --password:env
                      - PASS_VAR
                      - --no-prompt
                    env: "{{ bootstrap_env }}"
          vars:
            base_env: "{{ (kc_container_spec.env | default([])) | rejectattr('name', 'equalto', 'KC_CACHE') | list }}"
            bootstrap_env: "{{ base_env + [{'name': 'KC_CACHE', 'value': 'local'}, {'name': 'PASS_VAR', 'value': tmp_adm_pass}] }}"

        - name: Wait for bootstrap-admin pod to finish
          kubernetes.core.k8s_info:
            namespace: "{{ dsc.keycloakx.namespace }}"
            kind: Pod
            name: "{{ bootstrap_pod_name }}"
          register: bootstrap_pod_status
          until: bootstrap_pod_status.resources[0].status.phase in ['Succeeded', 'Failed']
          retries: 50
          delay: 5

        - name: Get bootstrap-admin pod logs
          kubernetes.core.k8s_log:
            namespace: "{{ dsc.keycloakx.namespace }}"
            name: "{{ bootstrap_pod_name }}"
          register: bootstrap_pod_logs

        - name: Fail if bootstrap-admin pod did not succeed
          ansible.builtin.fail:
            msg: "{{ bootstrap_pod_logs.log_lines | default([bootstrap_pod_logs.log | default('no logs')]) }}"
          when: bootstrap_pod_status.resources[0].status.phase != 'Succeeded'
      always:
        - name: Delete bootstrap-admin pod
          kubernetes.core.k8s:
            state: absent
            namespace: "{{ dsc.keycloakx.namespace }}"
            kind: Pod
            name: "{{ bootstrap_pod_name }}"
          when: bootstrap_pod_name is defined
          ignore_errors: true

    - name: Update dsoadmin user
      community.general.keycloak_user:
        validate_certs: "{{ dsc.exposedCA.type == 'none' }}"
        auth_client_id: admin-cli
        auth_keycloak_url: https://{{ dsc.keycloakx.subDomain }}{{ dsc.global.rootDomain }}
        auth_realm: master
        auth_username: "{{ tmp_admin_username }}"
        auth_password: "{{ tmp_adm_pass }}"
        state: present
        realm: master
        credentials:
          - temporary: false
            type: password
            value: "{{ kc_adm_pass }}"
        username: dsoadmin
        first_name: Admin
        last_name: Admin
        email: admin@example.com
        enabled: true
        email_verified: true
        groups:
          - name: admin
            state: present
        force: true

    - name: Update keycloak secret
      kubernetes.core.k8s:
        kind: Secret
        name: keycloakx-admin-secret
        namespace: "{{ dsc.keycloakx.namespace }}"
        state: patched
        definition:
          data:
            KEYCLOAK_ADMIN_PASSWORD: "{{ kc_adm_pass | b64encode }}"

    - name: Update console inventory
      when: not dsc.global.gitOps.deploymentEnabled
      kubernetes.core.k8s:
        kind: Secret
        name: dso-config
        namespace: "{{ dsc.console.namespace }}"
        state: patched
        definition:
          data:
            KEYCLOAK_ADMIN_PASSWORD: "{{ kc_adm_pass | b64encode }}"

    - name: Remove temporary admin from master realm
      community.general.keycloak_user:
        validate_certs: "{{ dsc.exposedCA.type == 'none' }}"
        auth_client_id: admin-cli
        auth_keycloak_url: https://{{ dsc.keycloakx.subDomain }}{{ dsc.global.rootDomain }}
        auth_realm: master
        auth_username: dsoadmin
        auth_password: "{{ kc_adm_pass }}"
        state: absent
        realm: master
        username: "{{ tmp_admin_username }}"
        # NB: a leftover "tmpadm" (or "tmpadm-<timestamp>" from an earlier
        # interrupted run of this playbook) is not cleaned up here - each run
        # now uses a unique temp username, so nothing depends on removing old
        # ones, and their passwords were random and never recorded anywhere.
        # Remove them by hand from the master realm's user list if you want
        # the account list tidy.

    - name: Update new password in infra-vault
      # No `when: dsc.global.gitOps.deploymentEnabled` guard here (unlike
      # keycloak-admin-password-reset.yaml): on envs where that's false, the
      # keycloakx-admin-secret Secret is still AVP-rendered from this same
      # Vault path on every ArgoCD sync, so skipping the write would let the
      # next sync silently revert this reset (confirmed live on
      # formation-sdan: direct k8s patch alone got reverted within minutes).
      block:
        - name: Load variables for the vault-secrets post-install role
          ansible.builtin.include_vars:
            file: "../roles/gitops/vault-secrets/vars/keycloak-admin-password.yaml"

        - name: Post-install vault-secrets run
          ansible.builtin.import_role:
            name: "gitops/vault-secrets"
          vars:
            # Same reasoning as keycloak-admin-password-reset.yaml: without
            # this, write.yml's "Update vault secret" task silently skips
            # (post_conf_job is set above, post_vault_update was never set
            # here) even when it detects a real diff - confirmed live: a run
            # with a valid Vault token still produced zero writes until this
            # was added.
            post_vault_update: true

    - name: Get DSO Console server deployment
      kubernetes.core.k8s_info:
        kind: Deployment
        namespace: "{{ dsc.console.namespace }}"
        label_selectors:
          - app.kubernetes.io/name=cpn-console-server
      register: console_server_deploy

    - name: Set console_server_deploy_name fact
      when: console_server_deploy.resources | length > 0
      ansible.builtin.set_fact:
        console_server_deploy_name: "{{ console_server_deploy.resources[0].metadata.name }}"

    - name: Restart DSO Console server deployment
      when: console_server_deploy.resources | length > 0
      kubernetes.core.k8s:
        kind: Deployment
        name: "{{ console_server_deploy_name }}"
        namespace: "{{ dsc.console.namespace }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ now(fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        state: patched
      notify: Console Server Restart Info

    - name: Keycloak admin password changed
      ansible.builtin.debug:
        msg:
          - "Réinitialisation du mot de passe administrateur de l'instance Keycloak suivante effectuée :"
          - "    URL : https://{{ dsc.keycloakx.subDomain }}{{ dsc.global.rootDomain }}"
          - "    Namespace : {{ dsc.keycloakx.namespace }}"
          - ""
          - "Nouveaux identifiants :"
          - "    Utilisateur : dsoadmin "
          - "    Mot de passe : {{ kc_adm_pass }} "

  handlers:
    - name: Console Server Restart Info
      ansible.builtin.debug:
        msg: "Le deployment {{ console_server_deploy_name }} a été redémarré dans le namespace {{ dsc.console.namespace }}."

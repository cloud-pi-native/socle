---
- name: Nexus post-configuration
  hosts: localhost
  gather_facts: false
  vars:
    post_conf_job: true
    argo_infra_ns_check:
      failed: true
  tasks:
    - name: Import socle-config role
      ansible.builtin.import_role:
        name: socle-config

    - name: Get nexus_current_vault_values
      block:
        - name: Reset envs vars
          ansible.builtin.set_fact:
            envs: []

        - name: Set minimal envs vars
          ansible.builtin.set_fact:
            envs:
              - name: "{{ dsc_name }}"
                apps:
                  - argocd_app: nexus
                    vault_values:
                      auth:
                        adminPassword: "itDoesNotMatterWhatWeWriteHere"

        - name: Call vault-secrets role
          ansible.builtin.import_role:
            name: gitops/vault-secrets

    - name: Import nexus role
      ansible.builtin.import_role:
        name: gitops/post-install/nexus
